version: 2

sources:
  - name: raw
    description: >
      Append-only landing zone written by the loader. Every consumed Kafka
      record appears exactly once, keyed by (topic, partition_id, kafka_offset),
      which is what makes replays safe.
    schema: raw
    tables:
      - name: events
        description: One row per consumed Kafka record, including its JSONB payload.
        loaded_at_field: ingested_at
        freshness:
          warn_after: { count: 15, period: minute }
          error_after: { count: 60, period: minute }
        columns:
          - name: topic
            description: Source topic.
            data_tests: [not_null]
          - name: partition_id
            data_tests: [not_null]
          - name: kafka_offset
            data_tests: [not_null]
          - name: event_time
            description: Business timestamp taken from the payload.
          - name: ingested_at
            description: When the loader wrote the row.
            data_tests: [not_null]

      - name: late_events
        description: Records older than MAX_LATENESS_SECONDS, quarantined for reconciliation.
        columns:
          - name: lateness_seconds
            data_tests: [not_null]

      - name: dlq
        description: Records that could not be processed, with error class and message.
        columns:
          - name: error_class
            data_tests: [not_null]

  - name: landing
    description: >
      Current entity state after applying the event stream. Written with guarded
      upserts, so an older event can never overwrite a newer one.
    schema: landing
    tables:
      - name: orders
        columns:
          - name: order_id
            data_tests: [unique, not_null]
          - name: customer_id
            data_tests: [not_null]
          - name: updated_at
            data_tests: [not_null]
      - name: payments
        columns:
          - name: payment_id
            data_tests: [unique, not_null]
          - name: order_id
            data_tests: [not_null]
      - name: customers
        columns:
          - name: customer_id
            data_tests: [unique, not_null]
