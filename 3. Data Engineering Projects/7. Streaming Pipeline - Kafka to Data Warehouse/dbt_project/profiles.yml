# Warehouse connection for the pipeline. Values come from the same environment
# variables the loader uses, so one .env drives both.
kafka_warehouse:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER', 'warehouse') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'warehouse') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      schema: marts
      threads: 4
      connect_timeout: 10
      keepalives_idle: 0
